services:
  db:
    image: postgres:15-alpine
    container_name: server_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data # Mantiene los datos en memoria para que al apagar se limpie todo
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro # Me estaba dando error la ejecucion pero porque nunca hacía las tablas jeje así que con esto al montarse el contenedor se ejecuta el sql de creación de tablas de sqlc.
    healthcheck: # Esto lo tuve que añadir porque sino el contenedor de Go intentaba conectarse antes que la BD esté listay daba error de conexión.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d db"] # Por TCP (127.0.0.1): durante la inicialización Postgres solo escucha por socket, y así no se marca como "healthy" antes de que se hayan creado las tablas.
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: server_go
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://root:secretpassword@db:5432/db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy